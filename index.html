<!DOCTYPE html>

    <meta charset="UTF-8" />

    <title>q04ti — Journal, Writing & Archive</title>
    <script>
      (function() {
        try {
          if (localStorage.getItem('theme_user_override')) {
            localStorage.removeItem('theme_user_override');
          }
          var manual = localStorage.getItem('user_manual_theme');
          var siteDefault = localStorage.getItem('site_default_theme');
          // For visitors without manual preference, use the site default (cached from admin).
          // For first-time visitors, fallback is 'light' (matching CSS :root default) to prevent dark theme flash.
          var active = (manual === 'light' || manual === 'dark')
            ? manual
            : ((siteDefault === 'dark' || siteDefault === 'light') ? siteDefault : 'light');
          if (active === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch(e) {}
      })();
    </script>
    <meta name="description" content="Personal notebook, daily updates, essays, photographs, and life archive." />
