<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>q04ti — Journal, Writing & Archive</title>
    <script>
      (function() {
        try {
          if (localStorage.getItem('theme_user_override')) {
            localStorage.removeItem('theme_user_override');
          }
          var manual = localStorage.getItem('user_manual_theme');
          // Manual user toggle on public site always has highest priority
          if (manual === 'light') {
            document.documentElement.classList.remove('dark');
          } else if (manual === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            // Live server-injected state from admin settings (guarantees zero flash)
            var serverRendered = document.documentElement.getAttribute('data-theme-injected');
            if (serverRendered === 'dark') {
              document.documentElement.classList.add('dark');
              try { localStorage.setItem('site_default_theme', 'dark'); } catch(e) {}
            } else if (serverRendered === 'light') {
              document.documentElement.classList.remove('dark');
              try { localStorage.setItem('site_default_theme', 'light'); } catch(e) {}
            } else {
              // Client fallback if rendered statically without injection
              var siteDefault = localStorage.getItem('site_default_theme');
              if (siteDefault === 'dark') {
                document.documentElement.classList.add('dark');
              } else if (siteDefault === 'light') {
                document.documentElement.classList.remove('dark');
              }
            }
          }
        } catch(e) {}
      })();
    </script>
    <meta name="description" content="Personal notebook, daily updates, essays, photographs, and life archive." />
