<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&amp;display=swap');
      .brand-letter {
        font-family: 'Newsreader', 'Georgia', 'Baskerville', 'Times New Roman', serif;
        font-size: 320px;
        font-weight: 400;
        fill: #f4f4f6;
        text-anchor: middle;
        dominant-baseline: central;
      }
    </style>
    <radialGradient id="bgGlow" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#1c1c22"/>
      <stop offset="60%" stop-color="#0e0e11"/>
      <stop offset="100%" stop-color="#070709"/>
    </radialGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- Dark Obsidian Squircle Canvas -->
  <rect width="512" height="512" rx="116" fill="url(#bgGlow)"/>

  <!-- Subtle Luxury Hairline Rim -->
  <rect width="506" height="506" x="3" y="3" rx="113" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>
  <rect width="496" height="496" x="8" y="8" rx="108" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>

  <!-- Editorial Monogram: q. -->
  <g transform="translate(242, 234)">
    <text class="brand-letter" x="0" y="0">q</text>
    <circle cx="98" cy="116" r="13" fill="url(#amberGrad)"/>
  </g>
</svg>
