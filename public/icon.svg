<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1c1f"/>
      <stop offset="100%" stop-color="#0c0c0e"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="spineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2d2d32"/>
      <stop offset="100%" stop-color="#1e1e22"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background App Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>

  <!-- Notebook Body with Shadow -->
  <g filter="url(#shadow)">
    <!-- Book Cover -->
    <rect x="120" y="100" width="272" height="312" rx="20" fill="#18181b" stroke="#3f3f46" stroke-width="2"/>
    
    <!-- Spine binding -->
    <path d="M 120 120 Q 120 100 140 100 L 160 100 L 160 412 L 140 412 Q 120 412 120 392 Z" fill="url(#spineGrad)"/>
    <line x1="160" y1="100" x2="160" y2="412" stroke="#27272a" stroke-width="3"/>

    <!-- Subtle bookmark ribbon -->
    <path d="M 230 100 L 230 200 L 245 185 L 260 200 L 260 100 Z" fill="url(#goldGrad)" opacity="0.95"/>

    <!-- Minimalist Ruled Page Lines -->
    <line x1="184" y1="240" x2="350" y2="240" stroke="#71717a" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
    <line x1="184" y1="275" x2="330" y2="275" stroke="#71717a" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
    <line x1="184" y1="310" x2="350" y2="310" stroke="#71717a" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
    <line x1="184" y1="345" x2="290" y2="345" stroke="#71717a" stroke-width="3" stroke-linecap="round" opacity="0.4"/>

    <!-- Warm Pen/Nib Monogram Accent -->
    <circle cx="340" cy="345" r="5" fill="#f59e0b"/>
  </g>
</svg>
